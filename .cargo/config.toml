#
#[unstable]
## This enables the custom JSON target feature
#json-target-spec = true
## This tells cargo to always recompile these crates for your custom target
#build-std = ["core", "compiler_builtins"]
#build-std-features = ["compiler-builtins-mem"]
#
#[build]
#target = "x86_64-blog_os.json"
